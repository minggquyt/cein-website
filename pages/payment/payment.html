<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>VietQR Generator</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #27ae60; }
        #qr-result { margin-top: 20px; display: none; }
        img { max-width: 100%; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="card">
    <h3>Thanh toán VietQR</h3>
    <input type="number" id="amount" placeholder="Nhập số tiền (VNĐ)">
    <input type="text" id="desc" placeholder="Nội dung chuyển khoản">
    <button onclick="handleGenerate()">Tạo mã QR</button>

    <div id="qr-result">
        <p>Quét để chuyển khoản:</p>
        <img id="qrImage" src="" alt="VietQR">
    </div>
</div>

<script>
    // Cấu hình tài khoản của bạn
    const CONFIG = {
        bank: "TPB",
        account: "10000180510",
        name: "NGUYEN MAI MINH QUY"
    };

    function handleGenerate() {
        const amount = document.getElementById('amount').value;
        const desc = document.getElementById('desc').value || "Chuyen tien";
        const qrContainer = document.getElementById('qr-result');
        const qrImg = document.getElementById('qrImage');

        if (!amount) return alert("Vui lòng nhập số tiền");

        // Hàm tạo link ảnh VietQR
        const qrUrl = `https://img.vietqr.io/image/${CONFIG.bank}-${CONFIG.account}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(desc)}&accountName=${encodeURIComponent(CONFIG.name)}`;
        
        qrImg.src = qrUrl;
        qrContainer.style.display = 'block';
    }
</script>

</body>
</html>
