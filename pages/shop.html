<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="/assets/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="./css/variable.css">
    <title>CEIN Shop</title>
</head>

<body>

    <header>
        <div class="header-top">
            <p clas="roboto-400">Complimentary U.S. No-Rush Shipping on orders of $95 or more. Shop now</p>
        </div>
        <nav class="navbar navbar-expand-md navbar-dark header-bottom" aria-label="Fourth navbar example">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img src="/assets/images/logo.png" width="85px" height="20px"
                        alt=""></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarsExample04" aria-controls="navbarsExample04" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon header-bottom-menu-icon material-symbols-outlined">
                        menu
                    </span>
                </button>
                <div class="collapse navbar-collapse" id="navbarsExample04">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0 header-bottom-list">
                        <li class="nav-item">
                            <a class="active roboto-400" aria-current="page" href="#">Shop</a>
                        </li>
                        <li class="nav-item"><a class="roboto-400" href="#">New Arrivals</a></li>
                        <li class="nav-item">
                            <a class=" roboto-400">Sales</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="dropdown-toggle roboto-400" href="#" data-bs-toggle="dropdown"
                                aria-expanded="false">Journel</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <a class="dropdown-item" href="#">Something else here</a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <div class="header-bottom-left-menu">
                        <form role="search" style="display: none;">
                            <input class="form-control" type="search" placeholder="Search" aria-label="Search" />
                        </form>
                        <img src="/assets/images/search.png" width="20px" height="20px" alt="">
                        <a href="#" class="roboto-400">Stores</a>
                        <img src="/assets/images/account.png" width="20px" height="20px" alt="">
                        <div class="left-menu-wishlist">
                            <img src="/assets/images/wishlist.png" width="20px" height="20px" alt="">
                            <span>2</span>
                        </div>
                        <div class="left-menu-bag">
                            <img src="/assets/images/bag.png" width="20px" height="20px" alt="">
                            <span>2</span>
                        </div>
                    </div>

                </div>
            </div>
        </nav>
    </header>
    <section class="filter-product">
        <div>
            <h3>Shop</h3>
            <div class="filter-options">
                <button class="btn-filter">Outerwear</button>
                <button class="btn-filter">Dresses</button>
                <button class="btn-filter">Skirts</button>
                <button class="btn-filter">Pants and Leggings</button>
                <button class="btn-filter">Strecth</button>
                <button class="btn-filter">Lounge</button>
            </div>
        </div>
        <div class="option">
            <div class="sort-option">
                <span>Sort</span>
                <img src="../assets/icon/CaretDown.png" alt="" style="width: 10px;">

            </div>
            <div class="action-filter">
                <button>Filter</button>
            </div>
        </div>
    </section>
    <section id="product-list">

    </section>
    <footer>

    </footer>

</body>
<script src="/assets/dist/js/bootstrap.bundle.min.js" class="astro-vvvwv3sm"></script>
<script src="../assets/js/shop.js"></script>

</html>
